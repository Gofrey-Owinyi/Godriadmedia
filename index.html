E</small></div><div class="s" onclick="openStory(\'GoTV Kenya\')"><div class="ring live"><div class="ri">📺<div class="live-badge">GoTV</div></div></div><b>GoTV Kenya</b><small class="on" style="color:#ffaa00">● Bundle</small></div>';let activeStories='';active.forEach(a=>{activeStories+='<div class="s" onclick="openChatWith(\''+a.name.replace(/'/g,"\\'")+'\')"><div class="ring on"><div class="ri">'+a.name[0]+'<div class="dot on"></div></div></div><b>'+a.name.split(' ')[0]+'</b><small class="on">Active</small></div>';});storiesBar.innerHTML=baseStories+activeStories;let myStory=localStorage.getItem('gm_my_story');if(myStory){let el=document.getElementById('yourStoryRi');if(el)el.innerHTML='<img src="'+myStory+'"><div class="add-plus"><i class="fa-solid fa-plus"></i></div><div class="dot on"></div>';}}}

let db;
function openDB(){
  return new Promise((res,rej)=>{
    if(db) return res(db);
    let req=indexedDB.open('GodriadDB_Owner_GodfreyOwinyi', 11);
    req.onupgradeneeded=e=>{
      let d=e.target.result;
      if(!d.objectStoreNames.contains('reels')) d.createObjectStore('reels',{keyPath:'id'});
      if(!d.objectStoreNames.contains('posts')) d.createObjectStore('posts',{keyPath:'id'});
    };
    req.onsuccess=e=>{db=e.target.result;res(db)};
    req.onerror=e=>rej(e.target.error);
  });
}
async function savePostDB(post){
  let database = await openDB();
  return new Promise((res,rej)=>{
    let tx=database.transaction('posts','readwrite');
    let store=tx.objectStore('posts');
    store.put(post);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(tx.error || e.target.error);
  });
}
async function getPostsDB(){
  let database = await openDB();
  return new Promise((res,rej)=>{
    let tx=database.transaction('posts','readonly');
    let store=tx.objectStore('posts');
    let req=store.getAll();
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=()=>res([]);
  });
}
async function deletePostDB(id){
  let database = await openDB();
  return new Promise((res,rej)=>{
    let tx=database.transaction('posts','readwrite');
    tx.objectStore('posts').delete(id);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e);
  });
}
async function saveReelDB(reel){
  let database = await openDB();
  return new Promise((res,rej)=>{
    let tx=database.transaction('reels','readwrite');
    tx.objectStore('reels').put(reel);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej('save failed');
  });
}
async function getReelsDB(){
  let database = await openDB();
  return new Promise((res,rej)=>{
    let tx=database.transaction('reels','readonly');
    let req=tx.objectStore('reels').getAll();
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=()=>res([]);
  });
}
async function deleteReelDB(id){
  let database = await openDB();
  return new Promise((res,rej)=>{
    let tx=database.transaction('reels','readwrite');
    tx.objectStore('reels').delete(Number(id));
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e);
  });
}

e="font-size:10px;color:#888">Only owner can delete</span>')+'</div></div>';});feed.innerHTML=html;if(status)status.textContent='✅ '+reels.length+' reels • Godriad Media @Godfrey Owinyi ONLY on reels';}
async function deleteReel(id){let reels=await getReelsDB();let r=reels.find(x=>String(x.id)===String(id));let user=getUser();if(!user || r.name!==user.name){alert('❌ You can only delete your own reel • This reel belongs to '+r.name);return;}let likedList=JSON.parse(localStorage.getItem('gm_liked_reels')||'[]');likedList=likedList.filter(x=>String(x)!==String(id));localStorage.setItem('gm_liked_reels',JSON.stringify(likedList));await deleteReelDB(Number(id));await renderReels();renderGodriadFeed();}

async function renderFeed(){
 try{

d;}

function compressImage(base64, maxW=1024, quality=0.6){return new Promise(res=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',quality));};img.src=base64;});}
